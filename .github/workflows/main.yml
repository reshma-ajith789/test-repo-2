name: Build and Package Angular app - docker, ECR, ECS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to run the workflow on'
        required: true
        default: 'main'
        
      run_optional_jobs:
        description: 'Do you want to run the Optional Jobs?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  buildangularapplication:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Prepare Deployment Package
        run: |
          docker build -t my-angular-app -f DockerFile .
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 041063310378.dkr.ecr.eu-central-1.amazonaws.com
          docker tag my-angular-app:latest 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:latest
          docker push 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:latest
          

  deployinfraangularapplication:
    if: ${{ github.event.inputs.branch == 'main' && github.event.inputs.run_optional_jobs == 'true'}}
    runs-on: self-hosted
    needs: buildangularapplication
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Verify code on main branch
        run: |
          aws cloudformation deploy --template-file ECS.yml --stack-name MyEcsStack --parameter-overrides ECSClusterName=MyEcsCluster TaskCPU=256 TaskMemory=512 SecurityGroupIds=sg-0d076bf99f2df0630 VpcId=vpc-0393ab23f063990ec SubnetIds=subnet-08f462f6fee70c8aa,subnet-0bb8c62fdef1611e7 ECSServiceName=MyECSService PAssignPublicIp=ENABLED PName=ecs-api PImage=041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:latest PFamily=ecs-api PNamespace=arn:aws:servicediscovery:eu-central-1:041063310378:namespace/ns-synvb4nzja35kngu PContainerPort=8080 PHostPort=8080 PServiceConnect=true PClientAliasesPort=8080 PExecutionRoleArn=arn:aws:iam::041063310378:role/ecsTaskExecutionRole PTaskRoleArn=arn:aws:iam::041063310378:role/ecsTaskRole PRootFileSystemReadonly=true

  updateangularapplication:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    needs: deployinfraangularapplication
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Verify code on develop branch
        run: aws ecs update-service --cluster MyEcsCluster --service MyEcsService --force-new-deployment
