name: Build and Package Angular app - docker, ECR, ECS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to run the workflow on'
        required: true
        default: 'main'
        
      run_optional_jobs:
        description: 'Do you want to run the Optional Jobs?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  buildangularapplication1:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Prepare Deployment Package
        run: |
          docker build -t my-angular-app -f DockerFile .
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 041063310378.dkr.ecr.eu-central-1.amazonaws.com
          docker tag my-angular-app:latest 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:my-angular-app
          docker push 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:my-angular-app
          

  deployinfraangularapplication1:
    if: ${{ github.event.inputs.branch == 'main' && github.event.inputs.run_optional_jobs == 'true'}}
    runs-on: self-hosted
    needs: buildangularapplication1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Verify code on main branch
        run: |
          aws cloudformation deploy --template-file ECS.yml --stack-name MyEcsStack --parameter-overrides ECSClusterName=MyEcsCluster TaskCPU=256 TaskMemory=512 SecurityGroupIds=sg-024a2678f1b431a87 VpcId=vpc-0ff9b4bb0ef33269a SubnetIds=subnet-0fe63b399bc3ae3b3,subnet-0500bff3d1b6325af ECSServiceName=MyECSService PAssignPublicIp=ENABLED PName=ecs-api PImage=041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:my-angular-app PFamily=ecs-api PNamespace=arn:aws:servicediscovery:eu-central-1:041063310378:namespace/ns-2ysmroggyko7gck7 PContainerPort=80 PHostPort=80 PServiceConnect=true PClientAliasesPort=80 PExecutionRoleArn=arn:aws:iam::041063310378:role/ecsTaskExecutionRole PTaskRoleArn=arn:aws:iam::041063310378:role/ecsTaskRole PRootFileSystemReadonly=true TargetGroupArn=arn:aws:elasticloadbalancing:eu-central-1:041063310378:targetgroup/tg/dcc1603a461d4423
  
  updateangularapplication1:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    needs: deployinfraangularapplication1
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Verify code on develop branch
        run: aws ecs update-service --cluster MyEcsCluster --service MyECSService --force-new-deployment

  buildangularapplication2:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    needs: updateangularapplication1
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Prepare Deployment Package
        run: |
          docker build -t my-angular-app-2 -f DockerFile .
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 041063310378.dkr.ecr.eu-central-1.amazonaws.com
          docker tag my-angular-app-2:latest 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:my-angular-app-2
          docker push 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:my-angular-app-2
          

  deployinfraangularapplication2:
    if: ${{ github.event.inputs.branch == 'main' && github.event.inputs.run_optional_jobs == 'true'}}
    runs-on: self-hosted
    needs: buildangularapplication2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Verify code on main branch
        run: |
          aws cloudformation deploy --template-file ECS.yml --stack-name MyEcsStack2 --parameter-overrides ECSClusterName=MyEcsCluster TaskCPU=256 TaskMemory=512 SecurityGroupIds=sg-024a2678f1b431a87 VpcId=vpc-0ff9b4bb0ef33269a SubnetIds=subnet-0fe63b399bc3ae3b3,subnet-0500bff3d1b6325af ECSServiceName=MyECSService2 PAssignPublicIp=ENABLED PName=ecs-api-2 PImage=041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:my-angular-app-2 PFamily=ecs-api-2 PNamespace=arn:aws:servicediscovery:eu-central-1:041063310378:namespace/ns-2ysmroggyko7gck7 PContainerPort=80 PHostPort=80 PServiceConnect=true PClientAliasesPort=80 PExecutionRoleArn=arn:aws:iam::041063310378:role/ecsTaskExecutionRole PTaskRoleArn=arn:aws:iam::041063310378:role/ecsTaskRole PRootFileSystemReadonly=true TargetGroupArn=arn:aws:elasticloadbalancing:eu-central-1:041063310378:targetgroup/tg/dcc1603a461d4423
  
  updateangularapplication2:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    needs: deployinfraangularapplication2
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Verify code on develop branch
        run: aws ecs update-service --cluster MyEcsCluster --service MyECSService2 --force-new-deployment
