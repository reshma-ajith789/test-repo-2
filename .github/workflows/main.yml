name: Build and Package Angular app - docker, ECR, ECS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to run the workflow on'
        required: true
        default: 'main'   

jobs:
  buildangularapplication:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Prepare Deployment Package
        run: |
          docker build -t my-angular-app -f DockerFile .
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 041063310378.dkr.ecr.eu-central-1.amazonaws.com
          docker tag my-angular-app:latest 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:latest
          docker push 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:latest
          

  deployinfraangularapplication:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          
      - name: Verify code on main branch
        run: |
          aws cloudformation deploy --template-file ECS.yml --stack-name MyEcsStack --parameter-overrides ECSClusterName=MyEcsCluster TaskCPU=256 TaskMemory=512 SecurityGroupIds=sg-0aa705a7453ca7cf9 VpcId=vpc-0393ab23f063990ec SubnetIds=subnet-0361847b00918b1a3,subnet-0239791e2d903ed84 ECSServiceName=MyECSService PAssignPublicIp=Disabled PName=ecs-api PImage=041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3:dockerimage PFamily=ecs-api PNamespace=arn:aws:servicediscovery:eu-central-1:041063310378:namespace/ns-synvb4nzja35kngu PContainerPort=8080 PHostPort=8080 PServiceConnect=true PClientAliasesPort=8080 PRootFileSystemReadonly=true

  updateangularapplication:
    if: ${{ github.event.inputs.branch == 'main'}}
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Verify code on develop branch
        run: aws ecs update-service --cluster MyEcsCluster --service MyEcsService --force-new-deployment

