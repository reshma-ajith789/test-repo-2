name: Rollback to previous good image V3

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to run'
        required: true
        default: 'main'

      action_type:
        description: 'Select workflow action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - 'deploy'
          - 'rollback'

      rollback_run_id:
        description: 'Enter the GitHub Run ID to roll back to'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: angular-app-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 041063310378.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: testrepo3
  ECRURL: 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3

jobs:

  # ==========================================
  # JOB 1: BUILD AND PUSH ANGULAR APPLICATION
  # ==========================================

  buildangularapplication1:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.branch == 'main' &&
        inputs.action_type == 'deploy'
      }}

    runs-on: ubuntu-latest
    environment: build-update

    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041063310378:role/GitHubActions-PROD-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Build and Push Docker Image
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          set -euo pipefail

          docker build -t my-angular-app -f DockerFile .

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker tag my-angular-app:latest \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_id }}"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_id }}"

      - name: Get Pushed Image Digest
        id: digest
        env:
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          set -euo pipefail

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: Unable to retrieve a valid image digest."
            exit 1
          fi

          echo "Image digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  # ==========================================
  # JOB 2: RETRIEVE PREVIOUS IMAGE FOR ROLLBACK
  # ==========================================

  rollback_image:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.branch == 'main' &&
        inputs.action_type == 'rollback'
      }}

    runs-on: ubuntu-latest
    environment: build-update

    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041063310378:role/GitHubActions-PROD-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Verify Rollback Run ID
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          set -euo pipefail

          if ! [[ "$ROLLBACK_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: A valid numeric rollback Run ID is required."
            exit 1
          fi

      - name: Get Rollback Image Digest
        id: digest
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          set -euo pipefail

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$ROLLBACK_RUN_ID" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: No valid ECR image found for Run ID $ROLLBACK_RUN_ID"
            exit 1
          fi

          echo "Rollback image digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  # ==========================================
  # JOB 3: DEPLOY CLOUDFORMATION AND ECS
  # ==========================================

  deployinfraangularapplication1:

    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        inputs.branch == 'main' &&
        (
          (
            inputs.action_type == 'deploy' &&
            needs.buildangularapplication1.result == 'success'
          ) ||
          (
            inputs.action_type == 'rollback' &&
            needs.rollback_image.result == 'success'
          )
        )
      }}

    runs-on: ubuntu-latest
    environment: deploy-infra

    needs:
      - buildangularapplication1
      - rollback_image

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041063310378:role/GitHubActions-PROD-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Select digest based on deploy or rollback action

      - name: Resolve Image Digest
        id: resolve
        env:
          ACTION_TYPE: ${{ inputs.action_type }}
          BUILD_DIGEST: ${{ needs.buildangularapplication1.outputs.image_digest }}
          ROLLBACK_DIGEST: ${{ needs.rollback_image.outputs.image_digest }}
        run: |
          set -euo pipefail

          if [[ "$ACTION_TYPE" == "rollback" ]]; then
            DIGEST="$ROLLBACK_DIGEST"
          else
            DIGEST="$BUILD_DIGEST"
          fi

          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: Image digest is missing or invalid."
            exit 1
          fi

          echo "Selected image digest: $DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Deploy selected image using CloudFormation

      - name: Deploy CloudFormation Stack
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail

          PImage="${ECRURL}@${IMAGE_DIGEST}"

          echo "Deploying image: $PImage"

          aws cloudformation deploy \
            --template-file ECS.yml \
            --stack-name MyEcsStack \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ECSClusterName=MyEcsCluster \
              TaskCPU=256 \
              TaskMemory=512 \
              SecurityGroupIds=sg-08d473c482e1c883f \
              VpcId=vpc-03e2a6d93d1e9e706 \
              SubnetIds=subnet-0d67bdc200eb9026e,subnet-05878923afaacaa08 \
              ECSServiceName=MyECSService \
              PAssignPublicIp=ENABLED \
              PName=ecs-api \
              PImage="$PImage" \
              PFamily=ecs-api \
              PNamespace=arn:aws:servicediscovery:eu-central-1:041063310378:namespace/ns-aamxdwur2qrayggd \
              PContainerPort=80 \
              PHostPort=80 \
              PServiceConnect=true \
              PClientAliasesPort=80 \
              PExecutionRoleArn=arn:aws:iam::041063310378:role/ecsTaskExecutionRole \
              PTaskRoleArn=arn:aws:iam::041063310378:role/ecsTaskRole \
              PRootFileSystemReadonly=true \
              TargetGroupArn=arn:aws:elasticloadbalancing:eu-central-1:041063310378:targetgroup/frontend-tg/09ae1d05ede166d3 \
              Pawsloggroup=/ecs/ecs-service-1

      # Wait until ECS finishes deployment

      - name: Wait for ECS Stability
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster MyEcsCluster \
            --services MyECSService

          echo "ECS deployment completed successfully."