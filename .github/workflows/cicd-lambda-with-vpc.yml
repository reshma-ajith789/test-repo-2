
name: Lambda Production Deployment and Rollback V1

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to run'
        required: true
        default: 'develop'

      action_type:
        description: 'Select workflow action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - 'deploy'
          - 'rollback'

      rollback_run_id:
        description: 'Enter the GitHub Run ID to roll back to'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: '041063310378'

  ECR_REGISTRY: 041063310378.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: testrepo3
  ECRURL: 041063310378.dkr.ecr.eu-central-1.amazonaws.com/testrepo3

  LAMBDA_FUNCTION_NAME: YourLambdaFunction
  CFN_STACK_NAME: MyLambdaStack

  LAMBDA_EXECUTION_ROLE_ARN: arn:aws:iam::041063310378:role/Lambda-Execution-Role

  VPC_ID: vpc-0b1232ec0ae6a3233
  VPC_SUBNET_IDS: subnet-0865c857814229d9f,subnet-0ce8bbf06cd14aeab
  CACHE_SECURITY_GROUP_ID: sg-0dd8706e26a6e7fa4

  LAMBDA_TIMEOUT: 30
  LAMBDA_MEMORY_SIZE: 512
  ENV_VAR_VALUE: Production
  ENVIRONMENT: prod

jobs:

  # ==========================================
  # JOB 1: BUILD AND PUSH LAMBDA IMAGE
  # ==========================================

  buildlambdaapplication:

    if: >-
      ${{
        github.ref == 'refs/heads/develop' &&
        inputs.branch == 'develop' &&
        inputs.action_type == 'deploy'
      }}

    runs-on: ubuntu-latest
    environment: build-update

    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041063310378:role/GitHubActions-PROD-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Build and Push Lambda Docker Image
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          IMAGE_TAG: my-lambda-app-${{ github.run_id }}
        run: |
          set -euo pipefail

          docker build -t my-lambda-app -f DockerFile .

          docker tag my-lambda-app:latest \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Successfully pushed image: $IMAGE_TAG"

      - name: Get Pushed Image Digest
        id: digest
        env:
          IMAGE_TAG: my-lambda-app-${{ github.run_id }}
        run: |
          set -euo pipefail

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: Unable to retrieve a valid image digest."
            exit 1
          fi

          echo "Image tag: $IMAGE_TAG"
          echo "Image digest: $DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  # ==========================================
  # JOB 2: RETRIEVE PREVIOUS IMAGE FOR ROLLBACK
  # ==========================================

  rollback_image:

    if: >-
      ${{
        github.ref == 'refs/heads/develop' &&
        inputs.branch == 'develop' &&
        inputs.action_type == 'rollback'
      }}

    runs-on: ubuntu-latest
    environment: build-update

    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041063310378:role/GitHubActions-PROD-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Verify Rollback Run ID
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          set -euo pipefail

          if ! [[ "$ROLLBACK_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: A valid numeric rollback Run ID is required."
            exit 1
          fi

      - name: Get Rollback Image Digest
        id: digest
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          set -euo pipefail

          IMAGE_TAG="my-lambda-app-$ROLLBACK_RUN_ID"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: No valid ECR image found for tag $IMAGE_TAG"
            exit 1
          fi

          echo "Rollback image tag: $IMAGE_TAG"
          echo "Rollback image digest: $DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  # ==========================================
  # JOB 3: DEPLOY LAMBDA CLOUDFORMATION
  # ==========================================

  deployinfralambdaapplication:

    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/develop' &&
        inputs.branch == 'develop' &&
        (
          (
            inputs.action_type == 'deploy' &&
            needs.buildlambdaapplication.result == 'success'
          ) ||
          (
            inputs.action_type == 'rollback' &&
            needs.rollback_image.result == 'success'
          )
        )
      }}

    runs-on: ubuntu-latest
    environment: deploy-infra

    needs:
      - buildlambdaapplication
      - rollback_image

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041063310378:role/GitHubActions-PROD-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Resolve Image Digest
        id: resolve
        env:
          ACTION_TYPE: ${{ inputs.action_type }}
          BUILD_DIGEST: ${{ needs.buildlambdaapplication.outputs.image_digest }}
          ROLLBACK_DIGEST: ${{ needs.rollback_image.outputs.image_digest }}
        run: |
          set -euo pipefail

          if [[ "$ACTION_TYPE" == "rollback" ]]; then
            DIGEST="$ROLLBACK_DIGEST"
          else
            DIGEST="$BUILD_DIGEST"
          fi

          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: Image digest is missing or invalid."
            exit 1
          fi

          echo "Selected image digest: $DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy Lambda CloudFormation Stack
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail

          CONTAINER_IMAGE_URI="${ECRURL}@${IMAGE_DIGEST}"

          echo "Deploying Lambda image: $CONTAINER_IMAGE_URI"

          aws cloudformation deploy \
            --template-file lambda-function-with-vpc.yml \
            --stack-name "$CFN_STACK_NAME" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              LambdaFunctionName="$LAMBDA_FUNCTION_NAME" \
              ContainerImageUri="$CONTAINER_IMAGE_URI" \
              LambdaExecutionRoleArn="$LAMBDA_EXECUTION_ROLE_ARN" \
              LambdaTimeout="$LAMBDA_TIMEOUT" \
              LambdaMemorySize="$LAMBDA_MEMORY_SIZE" \
              EnvVarValue="$ENV_VAR_VALUE" \
              VpcId="$VPC_ID" \
              VpcSubnetIds="$VPC_SUBNET_IDS" \
              CacheSecurityGroupId="$CACHE_SECURITY_GROUP_ID" \
              Environment="$ENVIRONMENT"

      - name: Wait for Lambda Update
        run: |
          set -euo pipefail

          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME"

          echo "Lambda deployment completed successfully."

      - name: Verify Lambda Image
        run: |
          set -euo pipefail

          aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query '{
              FunctionName: Configuration.FunctionName,
              State: Configuration.State,
              LastUpdateStatus: Configuration.LastUpdateStatus,
              ImageUri: Code.ImageUri
            }' \
            --output json

          echo "Lambda verification completed."
