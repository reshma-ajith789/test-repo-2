AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Cluster, Task Definition and Service (using existing ALB + Target Group)

Parameters:

  ECSClusterName:
    Type: String

  TaskCPU:
    Type: String
    Default: "256"

  TaskMemory:
    Type: String
    Default: "512"

  SecurityGroupIds:
    Type: CommaDelimitedList

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  DesiredTaskCount:
    Type: Number
    Default: 1

  PLaunchType:
    Type: String
    Default: FARGATE

  ECSServiceName:
    Type: String
    Default: my-service

  TargetGroupArn:
    Type: String
    Description: Provide the ARN of an existing target group

  PSchedulingStrategy:
    Type: String
    Default: REPLICA

  PAssignPublicIp:
    Type: String
    Default: ENABLED

  PPlatformVersion:
    Type: String
    Default: LATEST

  PMaximumPercent:
    Type: Number
    Default: 200

  PMinimumHealthyPercent:
    Type: Number
    Default: 100

  PDeploymentControllerType:
    Type: String
    Default: ECS

  PCpuArchitecture:
    Type: String
    Default: X86_64

  POperatingSystemFamily:
    Type: String
    Default: LINUX

  PCpu:
    Type: Number
    Default: 0

  PName:
    Type: String
    Default: app

  PAppProtocol:
    Type: String
    Default: http

  PContainerPort:
    Type: Number
    Default: 80    # your Angular runs on 80

  PHostPort:
    Type: Number
    Default: 80

  PProtocol:
    Type: String
    Default: tcp

  PlogDriver:
    Type: String
    Default: awslogs

  PFamily:
    Type: String
    Default: my-task-family

  PExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::041063310378:role/ecsTaskExecutionRole

  PTaskRoleArn:
    Type: String
    Default: arn:aws:iam::041063310378:role/ecsTaskRole

  PImage:
    Type: String
    Default: ""

  Pawsloggroup:
    Type: String
    Default: /ecs/my-service

  Pawslogsregion:
    Type: String
    Default: eu-central-1

  Pawslogsstreamprefix:
    Type: String
    Default: ecs

  PNetworkMode:
    Type: String
    Default: awsvpc

Resources:

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref Pawsloggroup
      RetentionInDays: 30

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref PFamily
      Cpu: !Ref TaskCPU
      Memory: !Ref TaskMemory
      NetworkMode: !Ref PNetworkMode
      RuntimePlatform:
        CpuArchitecture: !Ref PCpuArchitecture
        OperatingSystemFamily: !Ref POperatingSystemFamily
      RequiresCompatibilities: ["FARGATE"]
      ExecutionRoleArn: !Ref PExecutionRoleArn
      TaskRoleArn: !Ref PTaskRoleArn

      ContainerDefinitions:
        - Name: !Ref PName
          Image: !Ref PImage
          Essential: true
          Cpu: !Ref PCpu
          PortMappings:
            - Name: app-port
              ContainerPort: !Ref PContainerPort
              HostPort: !Ref PHostPort
              Protocol: !Ref PProtocol
              AppProtocol: !Ref PAppProtocol
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Pawsloggroup
              awslogs-region: !Ref Pawslogsregion
              awslogs-stream-prefix: !Ref Pawslogsstreamprefix

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: LogGroup
    Properties:
      ServiceName: !Ref ECSServiceName
      Cluster: !Ref ECSClusterName
      DesiredCount: !Ref DesiredTaskCount
      LaunchType: !Ref PLaunchType
      PlatformVersion: !Ref PPlatformVersion
      SchedulingStrategy: REPLICA
      TaskDefinition: !Ref TaskDefinition

      DeploymentController:
        Type: !Ref PDeploymentControllerType

      DeploymentConfiguration:
        MaximumPercent: !Ref PMaximumPercent
        MinimumHealthyPercent: !Ref PMinimumHealthyPercent

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref PAssignPublicIp
          SecurityGroups: !Ref SecurityGroupIds
          Subnets: !Ref SubnetIds

      LoadBalancers:
        - ContainerName: !Ref PName
          ContainerPort: !Ref PContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:

  ClusterName:
    Value: !Ref ECSClusterName

  ServiceName:
    Value: !Ref ECSServiceName

  TaskDefinitionArn:
    Value: !Ref TaskDefinition
